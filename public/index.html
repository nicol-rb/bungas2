<script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById("chat-form");
    const nameInput = document.getElementById("name");
    const messageInput = document.getElementById("message");
    const chatBox = document.getElementById("chat-box");

    // Função para desenhar a mensagem no ecrã
    function appendMessage(data) {
      const item = document.createElement("div");
      item.classList.add("msg");
      item.innerHTML = `<span>${data.user}:</span> ${data.text}`;
      chatBox.appendChild(item);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Carregar o histórico antigo enviado pelo servidor
    socket.on("load history", (messages) => {
      messages.forEach((data) => {
        appendMessage(data);
      });
    });

    // Enviar mensagem ao submeter o formulário
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (messageInput.value) {
        socket.emit("chat message", {
          user: nameInput.value,
          text: messageInput.value
        });
        messageInput.value = "";
      }
    });

    // Receber novas mensagens em tempo real
    socket.on("chat message", (data) => {
      appendMessage(data);
    });
  </script>
